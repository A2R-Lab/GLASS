# CPU-only verification of the locally-generated GPU test receipt.
#
# The GPU suite runs on the lab box via test/run_gpu_proof.sh, which writes a
# SIGNED receipt (test/gpu-proof.json) binding the git SHA, a fingerprint of
# the library + test sources, per-test outcomes, and the GPU info. This job
# verifies that receipt on every push — signature checked against the signer's
# public keys at github.com/<user>.keys — so the repo carries an auditable
# "the GPU suite passed on this code" check without any cloud GPU.
#
# Trust model: this is an attestation by a keyholder, not cryptographic proof
# of GPU execution — see the pytest-gpu-proof security docs.
name: verify-gpu-proof

permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # ancestor-commit check needs history

      - name: Check for a receipt
        id: receipt
        run: |
          if [ -f test/gpu-proof.json ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::no test/gpu-proof.json yet — run test/run_gpu_proof.sh on the GPU box and commit the receipt"; fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.receipt.outputs.present == 'true'
        with:
          python-version: '3.12'

      - name: Install pytest-gpu-proof (PyPI, pinned in test/requirements.txt)
        if: steps.receipt.outputs.present == 'true'
        run: pip install "$(grep -o '^pytest-gpu-proof==[0-9.]*' test/requirements.txt)"

      - name: Verify receipt
        if: steps.receipt.outputs.present == 'true'
        run: gpu-proof verify --receipt test/gpu-proof.json --require-gpu --expected-skips test/expected_skips.txt --policy test/gpu-proof-policy.json

  # Device lanes (test/gpu-proof-<lane>.json): a Jetson records each lane at
  # some ancestor of main, less often than the desktop receipt. Each lane is
  # verified against the tree it attests (a worktree at its commit), under the
  # lane policy (no carry, 180-day horizon), and that commit must be an
  # ancestor of the commit under test. The platforms page lists the lanes.
  lanes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pytest-gpu-proof (PyPI, pinned in test/requirements.txt)
        run: pip install "$(grep -o '^pytest-gpu-proof==[0-9.]*' test/requirements.txt)"

      - name: Verify every lane receipt at its own commit
        run: |
          set -euo pipefail
          shopt -s nullglob
          lanes=(test/gpu-proof-*.json)
          [ ${#lanes[@]} -gt 0 ] || { echo "::notice::no lane receipts"; exit 0; }
          for receipt in "${lanes[@]}"; do
            case "$receipt" in *policy*) continue ;; esac   # test/gpu-proof-policy-*.json
            lane=$(basename "$receipt" .json); lane=${lane#gpu-proof-}
            sha=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['repo']['commit_sha'])" "$receipt")
            git merge-base --is-ancestor "$sha" HEAD || { echo "::error::$receipt attests $sha, not an ancestor of HEAD"; exit 1; }
            git worktree add --detach "$RUNNER_TEMP/lane-$lane" "$sha"
            skips=test/expected_skips_$lane.txt; [ -f "$skips" ] || skips=test/expected_skips.txt
            echo "== $lane: $sha ($(git log -1 --format=%cs "$sha"))"
            gpu-proof verify --receipt "$receipt" --repo "$RUNNER_TEMP/lane-$lane" \
              --require-gpu --expected-skips "$skips" --policy test/gpu-proof-policy-lane.json
          done
