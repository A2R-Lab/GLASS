name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'          # API reference is generated from header doc-comments
      - 'glass*.cuh'
      - 'test/**'         # badges: surface coverage + receipt read the test tree
      - '.github/workflows/gh-pages.yml'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. Do NOT cancel in-progress production deploys.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      # GLASS is header-only CUDA: the API reference is produced by Doxygen and
      # bridged into Sphinx via Breathe. Doxygen is a system package.
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build documentation (fail on any warning)
        run: |
          cd docs
          make all SPHINXOPTS="-W --keep-going"

      # shields.io endpoint badges, served from the docs site: API-surface
      # coverage (device-code line coverage does not exist; this is the honest
      # metric) + the receipted GPU-test count from the signed receipt.
      - name: Generate badges
        run: |
          mkdir -p docs/build/html/badges
          python .github/scripts/surface_coverage.py --json docs/build/html/badges/surface.json
          python .github/scripts/receipt_badge.py docs/build/html/badges/receipt.json

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
