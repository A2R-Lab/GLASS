# GPU-less compile smoke: every push/PR compiles the full header surface and
# all examples with nvcc on a hosted runner (compilation needs no GPU). The
# actual GPU test suite runs on the lab box — see verify-gpu-proof.yml for the
# signed-receipt attestation that those tests passed.
name: CI

permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install static coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
          python3 -m pip install pytest numpy scipy

      - name: Require complete overload manifest + all declared obligations
        run: |
          python3 .github/scripts/api_contract_coverage.py \
            --check-manifest test/api-contracts.json --require-100
          python3 .github/scripts/coverage_obligations.py \
            --receipt test/gpu-proof.json
          python3 .github/scripts/shard_scope_closure.py
          git check-ignore --quiet bench/solver_ladder_20990101_000000.txt
          python3 -m pytest test/test_bench_common.py test/test_tune_isolation.py -q

  # Toolchain matrix (2026-11-02): nvcc only, no GPU. A cell shows that the
  # header surface, the examples and the installed package compile for that
  # (toolkit, architecture) pair; it is not a claim that the code runs there.
  # The platforms page in the docs reads this list. CUDA 13 cannot target
  # sm_70 or sm_72, and the hosted CUDA 11.8 / 12.4 repositories exist for
  # Ubuntu 22.04 only. The resource canary has baselines for the two desktop
  # cells only.
  compile-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cuda: '13.2.0', arch: sm_75,  os: ubuntu-latest }
          - { cuda: '13.2.0', arch: sm_86,  os: ubuntu-latest }
          - { cuda: '13.2.0', arch: sm_87,  os: ubuntu-latest }
          - { cuda: '13.2.0', arch: sm_90,  os: ubuntu-latest, canary: true }
          - { cuda: '13.2.0', arch: sm_100, os: ubuntu-latest }
          - { cuda: '13.2.0', arch: sm_120, os: ubuntu-latest, canary: true }
          - { cuda: '12.4.1', arch: sm_72,  os: ubuntu-22.04 }
          - { cuda: '12.4.1', arch: sm_75,  os: ubuntu-22.04 }
          - { cuda: '12.4.1', arch: sm_86,  os: ubuntu-22.04 }
          - { cuda: '12.4.1', arch: sm_89,  os: ubuntu-22.04 }
          - { cuda: '12.4.1', arch: sm_90,  os: ubuntu-22.04 }
          - { cuda: '11.8.0', arch: sm_70,  os: ubuntu-22.04 }
          - { cuda: '11.8.0', arch: sm_72,  os: ubuntu-22.04 }
          - { cuda: '11.8.0', arch: sm_75,  os: ubuntu-22.04 }
          - { cuda: '11.8.0', arch: sm_86,  os: ubuntu-22.04 }
          - { cuda: '11.8.0', arch: sm_89,  os: ubuntu-22.04 }
    name: compile-smoke (${{ matrix.cuda }}, ${{ matrix.arch }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install CUDA toolkit (nvcc only, no GPU needed)
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: ${{ matrix.cuda }}
          method: network
          sub-packages: '["nvcc"]'

      - name: Compile the full header surface
        run: |
          cat > smoke.cu <<'EOF'
          #include "glass.cuh"
          #include "glass-cgrps.cuh"
          #include "glass-defaults.cuh"
          __global__ void k(float* a, float* b, float* s) {
              glass::gemm<float, 4, 4, 4>(1.f, a, b, 0.f, s);
              glass::potrf<float, 4>(a);
              glass::posv<float>(4, a, b);
              glass::trsm<float, 4, 2>(a, b);
              glass::warp::trsv<float, 4>(a, b);
              glass::inv<float, 4>(a, s);
          }
          EOF
          nvcc -std=c++17 -arch=${{ matrix.arch }} -I. -c smoke.cu -o smoke.o

      - name: Compile all examples (MathDx-less set)
        run: make -C examples -j2 ARCH=${{ matrix.arch }}

      - name: Compile from the installed package
        run: |
          cmake -S . -B build/install-smoke \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/glass-install"
          cmake --install build/install-smoke
          nvcc -std=c++17 -arch=${{ matrix.arch }} \
            -I"$RUNNER_TEMP/glass-install/include" \
            -c .github/scripts/install_canary.cu -o install-canary.o

      - name: Static resource canary (regs/spill/smem vs committed baseline)
        if: matrix.canary
        run: python3 .github/scripts/resource_canary.py --arch ${{ matrix.arch }}
