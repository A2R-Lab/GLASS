# Keep pinned actions + pip deps fresh. Actions are SHA-pinned in the
# workflows; dependabot PRs bump the SHA and the trailing version comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # test/requirements.txt carries deliberate LOOSE FLOORS (>=): raising a
  # floor to the newest release constrains consumers for zero benefit, so
  # version-update PRs are off (limit 0). Security advisories still open PRs.
  - package-ecosystem: pip
    directory: /test
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  # docs/requirements.txt is exact-pinned (==); version bumps are wanted, but
  # merge them only after a local zero-warning `make all SPHINXOPTS=-W` build
  # (the CI docs build is fail-on-warning).
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
    ignore:
      # Sphinx 9.2+ needs Python 3.13; the docs are built locally with 3.12.
      - dependency-name: sphinx
        versions: [">=9.2"]
      # Breathe 5 matches doxygenfile against the index basename
      # (breathe-doc/breathe#1084); directory-qualified directives break.
      - dependency-name: breathe
        versions: [">=5"]
